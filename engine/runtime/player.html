<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>reel-studio player</title>
</head>
<body style="margin:0;background:#000">
<div id="stage"></div>
<script>
// Loads one project into the stage: player.html?project=<file URL of the project folder>.
// Order matters: config → timeline → tracks → kit → project scenes → runtime → sound.
(async () => {
  const q = new URLSearchParams(location.search);
  const root = q.get('project').replace(/\/?$/, '/');
  const here = new URL('.', location.href).href;
  const load = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(`cannot load ${src}`));
    document.body.appendChild(s);
  });
  await load(`${root}build/config.js`);
  await load(`${root}build/timeline.js`);
  try { await load(`${root}build/tracks.js`); } catch { window.REC = {}; }
  window.REC = window.REC || {};
  await load(`${here}kit.js`);
  await load(`${root}${window.PROJECT.scenes || 'scenes.js'}`);
  await load(`${here}kit-run.js`);
  await load(`${here}sound.js`);
})().catch((error) => { window.loadError = error.message; console.error(error); });
</script>
</body>
</html>
